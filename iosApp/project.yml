name: VITT
options:
  bundleIdPrefix: ie.shoonya
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig

settings:
  base:
    # Free Apple ID signing works for on-device development; a paid team is only
    # needed for TestFlight and the store. Set DEVELOPMENT_TEAM locally rather
    # than committing a team id.
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # Without this the asset catalogue ships but nothing points at it, and the
    # build has no icon while looking as though it does.
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:
  VITT:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: VITT
        CFBundleShortVersionString: "1.0.0"
        # Compose Multiplatform refuses to start without this: without it iOS
        # caps the app at 60fps on ProMotion displays, and CMP treats a silently
        # halved frame rate as a misconfiguration rather than a default.
        CADisableMinimumFrameDurationOnPhone: true
        CFBundleVersion: "1"
        # Only HTTPS to Google's APIs, which is exempt encryption. Without this
        # key App Store Connect stops every upload to ask the question.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Google redirects back to the reversed client id after consent. Without
        # this registration iOS has nowhere to deliver the callback and the
        # sign-in sheet simply never closes.
        CFBundleURLTypes:
          - CFBundleURLName: google-oauth
            CFBundleURLSchemes:
              - com.googleusercontent.apps.1009164273104-9vueslno0lnaug94cl848pcesb2j1rnf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ie.shoonya.vitt
        # The Kotlin framework is produced by Gradle into composeApp/build.
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../composeApp/build/bin/$(KOTLIN_TARGET)/$(KOTLIN_FRAMEWORK)Framework
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - ComposeApp
          # SQLDelight's native driver calls into the system SQLite but the
          # Kotlin framework does not carry it, so the app has to link it.
          - -lsqlite3
        # Selects the right Kotlin output directory for device vs simulator.
        KOTLIN_TARGET[sdk=iphonesimulator*]: iosSimulatorArm64
        KOTLIN_TARGET[sdk=iphoneos*]: iosArm64
        # The Kotlin framework only builds for arm64 simulators: there is no
        # iosX64 target in composeApp. Saying so explicitly makes a stray
        # x86_64 build fail with that sentence instead of several hundred
        # "ignoring file ... required architecture x86_64" linker warnings
        # followed by an unexplained link failure, which is how this was found.
        ARCHS[sdk=iphonesimulator*]: arm64
      configs:
        # Which Kotlin framework each app configuration links. Release used to
        # inherit the hardcoded debug path, so a Release build of the app linked
        # the DEBUG Kotlin framework: unoptimised, much larger, and what a store
        # submission would have shipped. Debug builds never revealed it.
        Debug:
          KOTLIN_FRAMEWORK: debug
        Release:
          KOTLIN_FRAMEWORK: release
    preBuildScripts:
      - name: Build Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          if [ "$SDK_NAME" == *simulator* ] || [[ "$SDK_NAME" == iphonesimulator* ]]; then
            TARGET=IosSimulatorArm64
          else
            TARGET=IosArm64
          fi
          # Must match FRAMEWORK_SEARCH_PATHS above, or the app links a
          # framework this script never built.
          if [ "$CONFIGURATION" = "Release" ]; then
            KOTLIN_CONF=Release
          else
            KOTLIN_CONF=Debug
          fi
          ./gradlew :composeApp:link${KOTLIN_CONF}Framework$TARGET
