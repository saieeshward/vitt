        - heading "How to Create and Use a Separate Plan for Each Currency" [level=2] [ref=f2e43]
        - paragraph [ref=f2e44]:
          - text: When using multiple currencies (like US dollars and Canadian dollars), we recommend
          - strong [ref=f2e45]: creating a separate plan for each
          - text: . You record what you
          - strong [ref=f2e46]: send
          - text: ", and you record what you"
          - strong [ref=f2e47]: receive
          - text: . This simplifies the process of handling currency fluctuations, exchange rates, charges, and fees.
        - paragraph [ref=f2e48]: In the steps below, we'll use US dollars as a primary currency/plan and Canadian dollars as a secondary currency/plan. These steps will work with any currencies.
        - heading "How to Create a Separate Plan for Each Currency" [level=3] [ref=f2e49]
