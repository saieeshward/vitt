        - heading "How to Use a Separate Plan for Each Currency" [level=3] [ref=f2e111]
        - paragraph [ref=f2e112]: "When you're ready to convert money from your primary currency to your secondary currency, follow these steps:"
        - list [ref=f2e113]:
          - listitem [ref=f2e114]:
            - paragraph [ref=f2e115]: Open the primary plan (US dollars).
          - listitem [ref=f2e116]:
            - paragraph [ref=f2e117]: Assign the amount of money you're converting to the "Currency Transfer" category.
          - listitem [ref=f2e118]:
            - paragraph [ref=f2e119]: Record an outflow transaction for the amount of money leaving the plan using "Currency Transfer" as the category.
          - listitem [ref=f2e120]:
            - paragraph [ref=f2e121]: Open the secondary plan (Canadian dollars).
          - listitem [ref=f2e122]:
            - paragraph [ref=f2e123]:
              - text: Record an inflow transaction,
              - strong [ref=f2e124]: factoring in the exchange rate and any fees
              - text: ", categorizing the funds to Income: Ready to Assign (called Inflow: Ready to Assign on Web)."
          - listitem [ref=f2e125]:
            - paragraph [ref=f2e126]: Assign your money to zero.
        - paragraph [ref=f2e127]:
          - strong [ref=f2e128]: "*"
          - text: Adding a "Currency Transfer" category in both plans can be beneficial if you're transferring back-and-forth between the two. If that's the case, and you would like to transfer money from your secondary to your primary plan, you can follow the directions in the above section, swapping the words "primary" and "secondary."
        - generic [ref=f2e129]:
          - heading "Additional Tips:" [level=4] [ref=f2e130]
          - list [ref=f2e131]:
            - listitem [ref=f2e132]:
              - paragraph [ref=f2e133]: When adding accounts to your plans, make sure all accounts in a plan use the same currency. Every account in your primary plan should be in your primary currency. Every account in your secondary plan should be in your secondary currency. This prevents issues with exchange rates.
            - listitem [ref=f2e134]:
              - paragraph [ref=f2e135]:
                - text: Reconcile often!
                - link "Reconciliation" [ref=f2e136] [cursor=pointer]:
                  - /url: https://support.ynab.com/en_us/reconciling-accounts-a-guide-BJFE3fHys
                - text: is always a good idea, but it’s especially important when you’re spending in multiple currencies. Your exchange rate depends on
                - strong [ref=f2e137]: when
                - text: the vendor submits the transaction. In some countries, vendors send transactions only weekly (rather than in real-time). Your exchange rate could vary depending on when your bank clears the transaction.
        - paragraph [ref=f2e138]:
          - link "Back to Top" [ref=f2e139] [cursor=pointer]:
            - /url: "#backtotop"
        - separator [ref=f2e140]
        - heading "Traveling to a Country That Has Another Currency" [level=2] [ref=f2e141]
        - paragraph [ref=f2e142]:
          - text: When traveling to a country that has another currency, it is easiest to
          - link "use a single category" [ref=f2e143] [cursor=pointer]:
            - /url: https://support.ynab.com/en_us/adding-removing-and-customizing-categories-a-guide-HJFO5j909
          - text: ", like \"Vacation,\" for all your spending. If you’d like to distinguish between trips, you can use the memo field when"
          - link "entering the transaction" [ref=f2e144] [cursor=pointer]:
            - /url: https://support.ynab.com/en_us/how-to-add-transactions-in-ynab-HyDwA_byi#add
          - text: "to label your transactions (example: #2025beach)."
        - heading "Tracking Purchases While on Vacation" [level=4] [ref=f2e145]
        - list [ref=f2e146]:
          - listitem [ref=f2e147]:
            - paragraph [ref=f2e148]:
              - strong [ref=f2e149]: "If you are spending from a cash account:"
              - text: Enter transactions as they happen. Estimate the exchange rate and conversion fees to determine the amount.
              - link "Flag the transactions" [ref=f2e150] [cursor=pointer]:
                - /url: https://support.ynab.com/en_us/flags-a-guide-Skh8Xb4kj#add
              - text: to review later and update the amount based on what clears your bank.
          - listitem [ref=f2e151]:
            - paragraph
          - listitem [ref=f2e152]:
            - paragraph [ref=f2e153]:
              - strong [ref=f2e154]: "If you are using a credit card:"
              - text: Follow the cash suggestions above, or you can wait until the converted transaction hits your bank account.
              - link "Add it to YNAB" [ref=f2e155] [cursor=pointer]:
                - /url: https://support.ynab.com/en_us/how-to-add-transactions-in-ynab-HyDwA_byi#add
              - text: with the amount your bank shows, or
              - link "let it import" [ref=f2e156] [cursor=pointer]:
                - /url: https://support.ynab.com/en_us/linked-accounts-B1991f2Cc#import
              - text: if you have your accounts linked. When you get home, we recommend
              - link "reconciling your accounts" [ref=f2e157] [cursor=pointer]:
                - /url: https://support.ynab.com/en_us/reconciling-accounts-a-guide-BJFE3fHys#process
              - text: to ensure your balances in YNAB match the bank.
        - paragraph [ref=f2e158]:
          - link "Back to Top" [ref=f2e159] [cursor=pointer]:
            - /url: "#backtotop"
