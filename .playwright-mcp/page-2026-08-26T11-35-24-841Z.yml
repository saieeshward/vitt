        - heading "Setting Up Your New Plan" [level=2] [ref=f34e91]
        - paragraph [ref=f34e92]:
          - text: When you create a new plan on iOS or Android, a checklist appears on the
          - emphasis [ref=f34e93]: Home
          - text: "tab to help you set it up. It has three steps:"
        - list [ref=f34e94]:
          - listitem [ref=f34e95]:
            - paragraph [ref=f34e96]:
              - emphasis [ref=f34e97]: Personalize plan
              - text: — opens
              - link "Edit Plan" [ref=f34e98] [cursor=pointer]:
                - /url: https://support.ynab.com/en_us/plan-and-adjust-with-edit-plan-and-cost-to-be-me-ByR7vpqPyx
              - text: ", where you can adjust your categories and"
              - link "targets" [ref=f34e99] [cursor=pointer]:
                - /url: https://support.ynab.com/en_us/how-to-use-targets-rk5kkI9ks
              - text: .
          - listitem [ref=f34e100]:
            - paragraph [ref=f34e101]:
              - emphasis [ref=f34e102]: Add accounts
              - text: — opens the flow to
              - link "add accounts" [ref=f34e103] [cursor=pointer]:
                - /url: https://support.ynab.com/en_us/how-to-add-an-account-ByoxswMJs
              - text: to your new plan.
          - listitem [ref=f34e104]:
            - paragraph [ref=f34e105]:
              - emphasis [ref=f34e106]: Fund categories
              - text: — opens Assign mode so you can
              - link "assign your money" [ref=f34e107] [cursor=pointer]:
                - /url: https://support.ynab.com/en_us/assigning-your-money-a-guide-SypgkrNJi
              - text: .
        - paragraph [ref=f34e108]: The checklist is a set of shortcuts — you can also complete any of these steps on your own, at any time.
        - paragraph [ref=f34e109]:
          - strong [ref=f34e110]: "Note:"
          - text: The new plan checklist is available on iOS and Android only, and it doesn't analyze your past spending to create targets automatically. (That only happens during onboarding for your first plan; check out
          - link "Does YNAB create targets automatically?" [ref=f34e111] [cursor=pointer]:
            - /url: https://support.ynab.com/en_us/does-ynab-create-targets-automatically-HJ4k1nBWfg
          - text: for more information.)
        - paragraph [ref=f34e112]:
          - link "Back to Top" [ref=f34e113] [cursor=pointer]:
            - /url: "#backtotop"
        - separator [ref=f34e114]
        - heading "Frequently Asked Questions (FAQs)" [level=2] [ref=f34e115]
        - heading "Can I duplicate a plan?" [level=3] [ref=f34e116]
        - paragraph [ref=f34e117]:
          - text: There isn't a way to copy or duplicate a plan in YNAB. If you'd like a backup of the plan, you can
          - link "export your data" [ref=f34e118] [cursor=pointer]:
            - /url: https://support.ynab.com/en_us/how-to-export-plan-data-Sy_CouWA9
          - text: . You won't be able to import the data back into YNAB, but you'll be able to review it in most common spreadsheet apps.
        - paragraph [ref=f34e119]:
          - text: You could also make a
          - link "Fresh Start" [ref=f34e120] [cursor=pointer]:
            - /url: https://support.ynab.com/en_us/making-a-fresh-start-a-guide-HkXYR_c0q
          - text: . A Fresh Start clears out past transactions but keeps your setup intact for a clean slate. The current plan will be archived, and you can return to it anytime.
        - heading "What happens to my bank connections when I create a new plan?" [level=3] [ref=f34e121]
        - paragraph [ref=f34e122]:
          - text: Your Direct Import connections don't carry over to a new plan — you'll need to
          - link "add your accounts" [ref=f34e123] [cursor=pointer]:
            - /url: https://support.ynab.com/en_us/how-to-add-an-account-ByoxswMJs
          - text: and set up Direct Import again from scratch in the new plan.
        - paragraph [ref=f34e124]:
          - text: Your old plan and its connections will still exist (it stays accessible as a separate plan), but you may want to
          - link "unlink your accounts" [ref=f34e125] [cursor=pointer]:
            - /url: https://support.ynab.com/en_us/linked-accounts-B1991f2Cc#unlink
          - text: in the archived plan so that Direct Import doesn't continue updating balances there.
        - paragraph [ref=f34e126]:
          - strong [ref=f34e127]: "Note:"
          - text: If you had made a
          - link "Fresh Start" [ref=f34e128] [cursor=pointer]:
            - /url: https://support.ynab.com/en_us/plan-resets-and-fresh-starts-HkXYR_c0q
          - text: instead, your Direct Import connections would be set up automatically in the new plan, and the option to stop importing transactions in your archived plan is selected by default.
        - heading "How do I get rid of the checklist on my new plan?" [level=3] [ref=f34e129]
        - paragraph [ref=f34e130]: Tap the X on the checklist to dismiss it. Dismissal applies only to that specific plan, so the checklist won't reappear for it.
        - heading "I dismissed the checklist — can I get it back?" [level=3] [ref=f34e131]
        - paragraph [ref=f34e132]:
          - text: "The checklist can't be brought back once it's been dismissed. It links to steps you can take anytime, though:"
          - link "personalize your plan" [ref=f34e133] [cursor=pointer]:
            - /url: https://support.ynab.com/en_us/plan-and-adjust-with-edit-plan-and-cost-to-be-me-ByR7vpqPyx
          - text: ","
          - link "add your accounts" [ref=f34e134] [cursor=pointer]:
            - /url: https://support.ynab.com/en_us/how-to-add-an-account-ByoxswMJs
          - text: ", and"
          - link "fund your categories" [ref=f34e135] [cursor=pointer]:
            - /url: https://support.ynab.com/en_us/assigning-your-money-a-guide-SypgkrNJi
          - text: .
