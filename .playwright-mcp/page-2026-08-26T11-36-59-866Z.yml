          - tabpanel [ref=f44e44]:
            - list [ref=f44e45]:
              - listitem [ref=f44e46]:
                - paragraph [ref=f44e47]: You can delete an incorrect Reconciliation Balance Adjustment and then reconcile again.
              - listitem [ref=f44e48]:
                - paragraph [ref=f44e49]: You can select transactions with the lock icon that shouldn't be reconciled, duplicate them, delete the originals, and reconcile again.
            - paragraph [ref=f44e50]: The important thing is that you reconcile to the accurate amount at your bank, not that you get it perfect the first time.
