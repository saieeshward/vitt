        - heading "Import Transactions" [level=2] [ref=f28e159]
        - paragraph [ref=f28e160]: There are two ways to import transactions into YNAB.
        - 'heading "Option One: Direct Import" [level=3] [ref=f28e161]'
        - paragraph [ref=f28e162]:
          - text: The first option is to
          - link "link your account" [ref=f28e163] [cursor=pointer]:
            - /url: https://support.ynab.com/en_us/linked-accounts-B1991f2Cc
          - text: in YNAB with your real-world account. This will allow you to import transactions once they clear the bank.
        - paragraph [ref=f28e164]:
          - text: If you'd rather not link the accounts, your bank isn't supported, or the connection is currently down, don't worry — we got you. 💪 YNAB is fully functional
          - strong [ref=f28e165]: without Direct Import
          - text: using our additional entry or import methods—and rest assured, we're happy to help
          - link "troubleshoot your connection and imports" [ref=f28e166] [cursor=pointer]:
            - /url: https://support.ynab.com/en_us/troubleshooting-linked-accounts-BJ9Mv9b1s
          - text: in the meantime if Direct Import is a priority for you!
        - 'heading "Option Two: File-Based Importing" [level=3] [ref=f28e167]'
        - paragraph [ref=f28e168]:
          - text: Option Two is our
          - link "File-Based Importing" [ref=f28e169] [cursor=pointer]:
            - /url: https://support.ynab.com/en_us/file-based-import-a-guide-Bkj4Sszyo
          - text: feature (in the web app). You can download a file from your bank and drag-and-drop it right into YNAB. You might call it magic. ✨
        - paragraph [ref=f28e170]:
          - text: Either way, imported transactions will match right up with the ones you added on your phone or computer. You’ll even have the chance to approve the matches—or
          - link "manually match" [ref=f28e171] [cursor=pointer]:
            - /url: https://support.ynab.com/en_us/approving-and-matching-transactions-a-guide-ByYNZaQ1i#matching
          - text: two transactions if the amounts differed.
        - generic [ref=f28e172]:
          - heading "Looking to bring in historical transactions?" [level=4] [ref=f28e173]
          - paragraph [ref=f28e174]:
            - text: While you can bring in past transactions, categorizing all that past spending may not be worth the time investment because YNAB is all about prioritizing the money you have now and looking ahead. We do understand the desire to create a way to see trends or past patterns, though, so check out the
            - link "Can I Import Past Transactions from before My Starting Balance?" [ref=f28e175] [cursor=pointer]:
              - /url: https://support.ynab.com/en_us/the-starting-balance-an-overview-H1uozOfJs#past
            - text: section of our Starting Balance article if you want more information on that!
        - paragraph [ref=f28e176]:
          - link "Back to Top" [ref=f28e177] [cursor=pointer]:
            - /url: "#backtotop"
        - separator [ref=f28e178]
        - heading "Mix and Match" [level=2] [ref=f28e179]
        - paragraph [ref=f28e180]:
          - text: Why limit yourself to just one option when you can have 'em all? That's right—you can add transactions yourself, import transactions from a bank file,
          - strong [ref=f28e181]: and
          - text: have YNAB import them for you all at the same time!
        - paragraph [ref=f28e182]: This is especially handy when your account is linked but is temporarily unavailable, or if you're counting down the seconds until your financial institution clears a transaction. Sometimes YNABing is just too darn exciting to wait.
        - paragraph [ref=f28e183]: "Wondering whether a transaction was imported or manually entered? Here's how to check:"
        - list [ref=f28e184]:
          - listitem [ref=f28e185]:
            - paragraph [ref=f28e186]:
              - strong [ref=f28e187]: On a computer
              - text: "- double-click into the Payee field and then click the circled 'i' icon next to the payee name. If it's been imported, you'll see the Bank Import Details pop up with more specifics. If there's no icon, it was manually entered."
          - listitem [ref=f28e188]:
            - paragraph [ref=f28e189]:
              - strong [ref=f28e190]: On iOS
              - text: "- tap the transaction, then tap the Payee. If it's been imported, you'll see a Bank Import Details section at the top with more specifics. If you don't see that section listed, it was manually entered."
          - listitem [ref=f28e191]:
            - paragraph [ref=f28e192]:
              - strong [ref=f28e193]: On Android
              - text: "- tap the transaction, then tap the Payee. If it's been imported, you'll see a Bank Import Details section at the top with more specifics. If you don't see that section listed, it was manually entered."
        - paragraph [ref=f28e194]:
          - link "Back to Top" [ref=f28e195] [cursor=pointer]:
            - /url: "#backtotop"
