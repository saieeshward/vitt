              - strong [ref=f28e54]: In-App Button
              - text: If you're a long-time YNABer, you've noticed that
              - link "we've replaced the Add Transaction tab with the Spending tab" [ref=f28e55] [cursor=pointer]:
                - /url: https://support.ynab.com/en_us/spaces-in-the-mobile-app-S1iIZQoqgg
              - text: . Don't worry,
              - link "you'll still find an Add Transaction button to tap" [ref=f28e56] [cursor=pointer]:
                - /url: "#button"
              - text: at the bottom of the Home, Plan, and Spending tabs. One is also available at the bottom of each account register.
