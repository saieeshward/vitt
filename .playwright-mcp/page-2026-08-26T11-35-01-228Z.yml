        - 'heading "Adding Transactions: Mobile Overview" [level=2] [ref=f28e49]'
        - paragraph [ref=f28e50]: Whether you're at home or on the go, YNAB offers many ways to add transactions. Adding transactions as they occur, even if you use Direct Import, helps ensure you can always trust your plan. Here are a few of the common ways to add transactions...and you don't even have to open YNAB!
