          - listitem [ref=f28e68]:
            - paragraph [ref=f28e69]:
              - strong [ref=f28e70]: Widgets
              - text: You can
              - link "set up an Add Transaction widget" [ref=f28e71] [cursor=pointer]:
                - /url: https://support.ynab.com/en_us/ynab-widget-for-mobile-a-guide-HJPEEQYR9
              - text: on your Home Screen or For You page and tap it.
          - listitem [ref=f28e72]:
            - paragraph [ref=f28e73]:
              - strong [ref=f28e74]: Shortcuts
              - text: There are two ways to create shortcuts on iOS depending on where you'd like to access them. You can
              - link "create a shortcut and add it to your Home Screen" [ref=f28e75] [cursor=pointer]:
                - /url: https://support.ynab.com/en_us/shortcuts-on-ios-a-guide-Bk_lHa5Aq
              - text: . These shortcuts can include prefilled information such as the amount, payee, category, and account. If you'd like to
              - link "add transactions from your iOS lock screen" [ref=f28e76] [cursor=pointer]:
                - /url: https://support.ynab.com/en_us/shortcuts-on-ios-a-guide-Bk_lHa5Aq#lock
              - text: ", replace one of the two shortcuts at the bottom of the lock screen with our"
              - emphasis [ref=f28e77]: Add Transaction
              - text: shortcut.
          - listitem [ref=f28e78]:
            - paragraph [ref=f28e79]:
              - strong [ref=f28e80]: Siri and Spotlight
              - text: If you'd rather use search or your voice, iOS 26 allows you to
              - link "set up Siri and Spotlight" [ref=f28e81] [cursor=pointer]:
                - /url: https://support.ynab.com/en_us/using-siri-and-spotlight-with-ynab-B1Me9dj5ge
              - text: to add transactions. Once you've asked or searched for a category balance, you can tap on the result to add a new transaction.
          - listitem [ref=f28e82]:
            - paragraph [ref=f28e83]:
              - strong [ref=f28e84]: The YNAB App Icon
              - text: You can long press the YNAB app to add a transaction, no matter where you keep it.
