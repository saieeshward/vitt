          - article [ref=f12e163]:
            - link "Edit this page" [ref=f12e164] [cursor=pointer]:
              - /url: https://github.com/firefly-iii/docs/tree/main/docs/docs/explanation/financial-concepts/exchange-rates.md
            - heading "Exchange rate" [level=1] [ref=f12e167]
            - paragraph [ref=f12e168]: Firefly III can dynamically convert amounts from one currency into another using exchange rates. You can set the exchange rates yourself or allow Firefly III to download exchange rates for you.
            - generic [ref=f12e169]:
              - paragraph [ref=f12e170]: Warning
              - paragraph [ref=f12e171]:
                - text: Firefly III can only download the exchange rates of
                - link "the standard, built-in currencies" [ref=f12e172] [cursor=pointer]:
                  - /url: https://github.com/firefly-iii/firefly-iii/blob/main/database/seeders/TransactionCurrencySeeder.php#L38
                - text: .
            - paragraph [ref=f12e173]: This is useful for some of the charts that Firefly III shows you. All monetary amounts will be calculated back to your base currency.
            - heading "Configuration" [level=2] [ref=f12e174]
            - paragraph [ref=f12e175]:
              - text: Firefly III supports three options that allow you to use exchange rates in the application. The following settings are disabled by default. You can change them on the
              - code [ref=f12e176]: /settings/configuration
              - text: "-page of your Firefy III installation."
            - list [ref=f12e177]:
              - listitem [ref=f12e178]: "\"Enable exchange rates.\" This setting enables the feature in the first place. It will not be available otherwise."
              - listitem [ref=f12e179]: "\"Download exchange rates from the web.\" Firefly III will not download exchange rates unless you allow it to. Exchange rates can only be downloaded for the default currencies in Firefly III. They will be downloaded from a Firefly III Azure bucket."
              - listitem [ref=f12e180]:
                - text: In your preferences (
                - code [ref=f12e181]: /preferences
                - text: ) set the checkbox at "Display amounts in your primary currency".
            - heading "Initialization" [level=2] [ref=f12e182]
            - paragraph [ref=f12e183]: If you turn this on, transaction amounts will automatically be calculated in your primary currency whenever necessary. This happens when Firefly III boots. However, you may want to initialize this yourself if you want to.
            - paragraph [ref=f12e184]: By default, Firefly III ships with one or two sets of exchange rates for the built-in currencies. You can add new exchange rates yourself.
            - heading "Recalculate amounts in your primary currency" [level=2] [ref=f12e185]
            - paragraph [ref=f12e186]: Use the following command to recalculate all amounts. This may take some time if you have a lot of transactions in other currencies than your primary currency.
            - generic [ref=f12e188]:
              - navigation [ref=f12e189]:
                - button "Toggle line selection" [ref=f12e190] [cursor=pointer]
                - button "Copy to clipboard" [ref=f12e191] [cursor=pointer]
              - code [ref=f12e192]:
                - generic [ref=f12e193]: "# self managed"
                - generic [ref=f12e194]: php artisan correction:recalculate-pc-amounts
                - generic [ref=f12e196]: "# docker"
                - generic [ref=f12e197]: docker exec -it [container-id] php artisan correction:recalculate-pc-amounts
            - heading "Changing your base (default) currency" [level=2] [ref=f12e198]
            - paragraph [ref=f12e199]:
              - text: Firefly III only converts amounts back to your base (default) currency. You can set this currency on the
              - code [ref=f12e200]: /administrations
              - text: page. Other conversions are not supported. For example, if your base currency is the Euro, you cannot see your British Pounds in US Dollars. The conversion will go back to the Euro only.
            - paragraph [ref=f12e201]: If you change your primary currency, all amounts will have to be recalculated. This may take some time if you have a lot of transactions in other currencies than your default currencies.
            - paragraph [ref=f12e202]: You can do this manually as well, using the command mentioned earlier.
            - heading "Default exchange rate" [level=2] [ref=f12e203]
            - paragraph [ref=f12e204]: If Firefly III has no exchange rate data for either currency or when the conversion hasn't been calculated yet, the exchange rate is 1.
            - heading "Changing the exchange rates" [level=2] [ref=f12e205]
            - paragraph [ref=f12e206]: If you (significantly) change the exchange rates, you may want to recalculate the amounts to your primary currency again using the command mentioned earlier. This is not necessary, but it may be useful.
            - heading "Conversion versus \"foreign amount\"" [level=2] [ref=f12e207]
            - paragraph [ref=f12e208]: Firefly III transactions also have a "foreign amount"-field. If you set a foreign amount in your primary currency, that amount will be used instead of any calculated amount. Firefly III assumes that you know better what the converted amount is. This is especially useful when you have a bank that has steep exchange rates.
            - heading "Downloading exchange rates" [level=2] [ref=f12e209]
            - generic [ref=f12e210]:
              - paragraph [ref=f12e211]: Info
              - paragraph [ref=f12e212]: This only works for the default system provided currencies because free exchange rate data is hard to come by.
            - paragraph [ref=f12e213]:
              - text: Make sure that you have enabled the settings at
              - code [ref=f12e214]: /settings/configuration
              - text: ", and run the"
              - link "cron job" [ref=f12e215] [cursor=pointer]:
                - /url: ../../../how-to/firefly-iii/advanced/cron/
              - text: daily.
            - paragraph [ref=f12e216]: Firefly III will download new rates about every week. You should see the list of available rates expand slowly. Firefly III will not download historical rates, ie. the rates for last year or last month.
            - heading "Setting your own rates" [level=2] [ref=f12e217]
            - paragraph [ref=f12e218]:
              - text: Go to the
              - code [ref=f12e219]: /exchange-rates
              - text: and find your currency. You can set any rate you want to, in both directions.
