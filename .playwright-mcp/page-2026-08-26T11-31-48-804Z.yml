            - paragraph [ref=f9e141]:
              - text: Firefly III supports as many currencies as you like. By default, it ships with a variety of currencies. You can add your own currencies if you're missing one. The currency code must be compliant with
              - link "ISO 4217" [ref=f9e142] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/ISO_4217
              - text: .
            - paragraph [ref=f9e143]: Firefly III supports at most 8 decimals for currencies. This is due to system limits on most systems when it comes to math. In practice, this may mean you will not be able to add cryptocurrencies.
