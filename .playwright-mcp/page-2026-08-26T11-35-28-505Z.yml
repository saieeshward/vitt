                    - text: by Liz
                    - generic [ref=f35e48]:
                      - text: Last Updated
                      - time [ref=f35e49]: March 16, 2026
              - generic [ref=f35e50]:
                - paragraph [ref=f35e51]: Creating manual transactions is a helpful way to keep your budgeting up to date if your financial institution isn’t sending transactions automatically, if you spend cash that you want to keep track of in Monarch, or if you simply want to track a transaction before it gets imported from your financial institution.
                - paragraph [ref=f35e52]:
                  - strong [ref=f35e53]: "Please Note:"
                  - emphasis [ref=f35e54]: Monarch does not have a reconciling feature. So, if a manual transaction is created and a matching transaction syncs, the manual transaction will not be removed from your records.
                - paragraph [ref=f35e55]:
                  - strong [ref=f35e56]: Table of Contents
                - list [ref=f35e57]:
                  - listitem [ref=f35e58]:
                    - link "Creating manual transactions on desktop" [ref=f35e59] [cursor=pointer]:
                      - /url: "#h_01JCKEWAVTX3T4KB82GRAK0TNT"
                  - listitem [ref=f35e60]:
                    - link "Creating manual transactions on mobile" [ref=f35e61] [cursor=pointer]:
                      - /url: "#h_01JCKEWAVT3DQ1E9Z7G7WAJNSA"
                - heading [level=3] [ref=f35e62]:
                  - strong [ref=f35e63]: Creating manual transactions on desktop
                - paragraph [ref=f35e64]:
                  - text: Manual transactions can be added to manual accounts or synced accounts. When you add a manual transaction to a synced account, it will not change the balance of that account. When you add a manual transaction to a
                  - link "manual account" [ref=f35e65] [cursor=pointer]:
                    - /url: https://help.monarchmoney.com/hc/en-us/articles/360058187072-Manual-accounts
                  - text: ", you can choose to change the balance when creating that transaction."
                - list [ref=f35e66]:
                  - listitem [ref=f35e67]:
                    - text: Navigate to the desired account for the new manual transaction.
                    - list [ref=f35e68]:
                      - listitem [ref=f35e69]:
                        - text: Alternatively, navigate to
                        - link [ref=f35e70] [cursor=pointer]:
                          - /url: https://app.monarchmoney.com/transactions
                          - strong [ref=f35e71]: Transactions
                        - text: and select
                        - strong [ref=f35e72]: Add
                        - text: .
                  - listitem [ref=f35e73]:
                    - text: Select
                    - strong [ref=f35e74]: Add transaction
                    - text: .
                  - listitem [ref=f35e75]: Select if the transaction will be a debit or credit.
                  - listitem [ref=f35e76]: Enter the amount.
                  - listitem [ref=f35e77]: Set the merchant.
                  - listitem [ref=f35e78]: Set the date.
                  - listitem [ref=f35e79]: Choose an account.
                  - listitem [ref=f35e80]: Select a category.
                  - listitem [ref=f35e81]: Add a note (optional).
                  - listitem [ref=f35e82]: Add tags (optional).
                  - listitem [ref=f35e83]: Select the toggle to adjust the account balance if you choose a manual account. The toggle is set to adjust the manual account balance by default, so if you don’t want to adjust the balance, you can disable it.
                  - listitem [ref=f35e84]:
                    - text: Select
