              - listitem [ref=f17e124]:
                - paragraph [ref=f17e125]: Tap the account name that contains the balance adjustment.
              - listitem [ref=f17e126]:
                - paragraph [ref=f17e127]: Long-press (tap and hold) the specific balance adjustment transaction to access the options menu.
              - listitem [ref=f17e128]:
                - paragraph [ref=f17e129]:
                  - text: Tap
                  - emphasis [ref=f17e130]: Delete
                  - text: .
              - listitem [ref=f17e131]:
                - paragraph [ref=f17e132]:
                  - text: Confirm by tapping
                  - emphasis [ref=f17e133]: Delete
