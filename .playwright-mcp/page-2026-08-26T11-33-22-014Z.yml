        - separator [ref=f17e137]
        - heading "How Do Balance Adjustments Affect My Plan Numbers?" [level=2] [ref=f17e138]
        - paragraph [ref=f17e139]:
          - text: Balance adjustments don’t just affect your account balances—they affect your plan numbers, too! Because the money in your plan in YNAB is
          - strong [ref=f17e140]: based
          - text: "on the balances of your cash-positive accounts in YNAB, adjusting your account balances may adjust the amount of money in your overall plan. Here’s what happens:"
        - list [ref=f17e141]:
          - listitem [ref=f17e142]:
            - paragraph [ref=f17e143]:
              - strong [ref=f17e144]: For Cash accounts like checking and savings
              - text: ", the adjustment amount will be added to or deducted from your Ready to Assign amount. Review your categories and"
              - link "move money" [ref=f17e145] [cursor=pointer]:
                - /url: https://support.ynab.com/en_us/moving-money-in-your-plan-a-guide-ryyCKbBJi
              - text: to where it needs to be now.
          - listitem [ref=f17e146]:
            - paragraph [ref=f17e147]:
              - strong [ref=f17e148]: For credit card accounts
              - text: ", your plan won’t be affected, but you will want to double check that you have the amount you want set aside to pay your card’s bill in your Credit Card Payment category."
        - paragraph [ref=f17e149]:
          - text: Numbers still seem off? Try working through a
          - link "YNAB Checkup" [ref=f17e150] [cursor=pointer]:
            - /url: https://support.ynab.com/en_us/checkup-S1vJzWGzo
          - text: to make sure everything is adding up correctly. Feel free to "undo" the balance adjustment by following the steps in the section above to delete it.
        - paragraph [ref=f17e151]:
          - link "Back to Top" [ref=f17e152] [cursor=pointer]:
            - /url: "#backtotop"
        - separator [ref=f17e153]
        - heading "Why Should I Use a Reconciliation Balance Adjustment Instead of a Manual Balance Adjustment?" [level=2] [ref=f17e154]
        - paragraph [ref=f17e155]:
          - text: You may be wondering, “Can’t I just change my balance from in my Account Details? There’s a section there to update the working balance.” Good question! This is
          - strong [ref=f17e156]: NOT
          - text: the same thing as a Reconciliation Balance Adjustment, and this will show in your register as a Manual Balance Adjustment instead.
        - paragraph [ref=f17e157]:
          - text: We
          - strong [ref=f17e158]: don’t recommend
          - text: the Manual Balance Adjustment process since it creates an adjustment to the working balance (rather than the cleared balance). It doesn’t have the same protective behavior for your plan and overall numbers as a Reconciliation Balance Adjustment. We
          - strong [ref=f17e159]: recommend
          - text: Reconciliation Balance Adjustments
          - strong [ref=f17e160]
          - text: "because this process:"
        - list [ref=f17e161]:
          - listitem [ref=f17e162]:
            - paragraph [ref=f17e163]:
              - text: Assures the account balances match today (with no pending transaction confusion) and that you can trust your plan. Reconciliation Balance Adjustments change the
              - strong [ref=f17e164]: cleared
              - text: balance of the account, keeping your balances accurate.
          - listitem [ref=f17e165]:
            - paragraph [ref=f17e166]: Makes it easier to check next time if the account balance is off. You’ll know when you last reconciled, and you’ll only have to check transactions since that time. (Any previously reconciled transactions will show with a lock icon).
          - listitem [ref=f17e167]:
            - paragraph [ref=f17e168]: Prevents past, incorrect transactions from importing. (Transactions more than three days prior to the last reconciliation date will not import.)
          - listitem [ref=f17e169]:
            - paragraph [ref=f17e170]: Speeds up plan loading if completed regularly. Each time you reconcile, you can then hide reconciled transactions. Once they are filtered out, they won't load every time you load your plan.
        - generic [ref=f17e171]:
          - heading "Reconciliation Balance Adjustments for Tracking Accounts" [level=4] [ref=f17e172]
          - paragraph [ref=f17e173]:
            - text: Do you use this manual balance adjustment process for your tracking accounts? Go ahead and try making a reconciliation balance adjustment instead so you can reap these protective benefits for your balance and transactions. Check out our instructions in
            - 'link "Tracking Investment Accounts: A Guide" [ref=f17e174] [cursor=pointer]':
              - /url: https://support.ynab.com/en_us/tracking-investment-accounts-a-guide-r1Bzjxd05
            - text: for more!
        - paragraph [ref=f17e175]:
          - link "Back to Top" [ref=f17e176] [cursor=pointer]:
            - /url: "#backtotop"
