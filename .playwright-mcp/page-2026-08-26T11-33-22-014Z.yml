        - separator [ref=f17e48]
        - heading "When Should I Make a Balance Adjustment?" [level=2] [ref=f17e49]
        - paragraph [ref=f17e50]: When assigning money in your plan, it's important to know the balances in YNAB are accurate. Balance adjustments are used to correct the balance in your YNAB account if and when you can’t find the discrepancy causing the difference from what shows in your actual account register.
        - paragraph [ref=f17e51]:
          - text: The process of creating a Reconciliation Balance Adjustment occurs organically (if needed) as you go through the Reconciliation process. We highly recommend working through the steps laid out in
          - link "Reconciling Accounts" [ref=f17e52] [cursor=pointer]:
            - /url: https://support.ynab.com/en_us/reconciling-accounts-a-guide-BJFE3fHys
          - strong [ref=f17e53]: regularly
          - text: going forward! We recommend reconciling at least once a week. This will prevent you from needing to make balance adjustments as often (if ever!).
        - paragraph [ref=f17e54]:
          - text: If you’re finding that you’re repeatedly needing to make a Reconciliation Balance Adjustment each time you go through the steps, that’s not expected, so we’d love to help! Check out our
          - link "Troubleshooting Reconciliation Issues" [ref=f17e55] [cursor=pointer]:
            - /url: https://support.ynab.com/en_us/troubleshooting-reconciliation-issues-rJkijlVki#everytime
          - text: article to find your scenario, and don’t hesitate to
          - link "tell the chatbot you need a human or send us an email" [ref=f17e56] [cursor=pointer]:
            - /url: https://support.ynab.com/en_us/how-to-get-help-SygqcvtC5
          - text: if you’re still stuck.
        - paragraph [ref=f17e57]:
          - link "Back to Top" [ref=f17e58] [cursor=pointer]:
            - /url: "#backtotop"
        - separator [ref=f17e59]
        - heading "How to Create a Reconciliation Balance Adjustment" [level=2] [ref=f17e60]
        - generic [ref=f17e61]:
          - tablist [ref=f17e63]:
            - tab "iOS" [ref=f17e64] [cursor=pointer]
            - tab "Android" [ref=f17e65] [cursor=pointer]
            - tab "Web" [ref=f17e66] [cursor=pointer]
          - tabpanel [ref=f17e68]:
            - list [ref=f17e69]:
              - listitem [ref=f17e70]:
                - paragraph [ref=f17e71]: First, process all of your uncleared transactions.
                - list [ref=f17e72]:
                  - listitem [ref=f17e73]:
                    - paragraph [ref=f17e74]:
                      - text: Go to your account register and tap the banner displaying “Show [#] uncleared transactions." This banner will be dismissed once
                      - strong [ref=f17e75]: all
                      - text: transactions cleared at the bank have been marked as cleared or reconciled in YNAB.
                  - listitem [ref=f17e76]:
                    - paragraph [ref=f17e77]:
                      - text: If you need to change the status of a transaction, tap on the transaction, tap
                      - emphasis [ref=f17e78]: Show more
                      - text: ", toggle the correct status (cleared or uncleared), and then tap"
                      - emphasis [ref=f17e79]: Save
                      - text: .
                  - listitem [ref=f17e80]:
                    - paragraph [ref=f17e81]: "Remember: the transactions’ status should match with the bank."
                    - list [ref=f17e82]:
                      - listitem [ref=f17e83]:
                        - paragraph [ref=f17e84]:
                          - text: If they have cleared the bank (or are very old), they should have a filled C. If they don't, tap the transaction, tap
                          - emphasis [ref=f17e85]: Show more
                          - text: ", and toggle"
                          - emphasis [ref=f17e86]: Cleared
                          - text: on. Then, tap
                          - emphasis [ref=f17e87]: Save
                          - text: .
                      - listitem [ref=f17e88]:
                        - paragraph [ref=f17e89]: If they are pending at the bank, or your bank doesn't even know about them yet, they should have an unfilled C. Leave them uncleared.
              - listitem [ref=f17e90]:
                - paragraph [ref=f17e91]: Tap on the three dots icon button in the top right corner.
              - listitem [ref=f17e92]:
                - paragraph [ref=f17e93]:
                  - text: Tap
                  - emphasis [ref=f17e94]: Reconcile
                  - text: .
              - listitem [ref=f17e95]:
                - paragraph [ref=f17e96]:
                  - text: A pop-up will ask if your bank’s balance matches the current Cleared balance that YNAB is showing.
                  - strong [ref=f17e97]:
                    - text: Tap
                    - emphasis [ref=f17e98]: Enter Updated Balance
                    - text: and enter your current cleared balance
                  - text: ", tapping"
                  - emphasis [ref=f17e99]: Next
                  - text: when you’re done. Make sure the toggle is set to red if you're entering a negative balance.
              - listitem [ref=f17e100]:
                - paragraph [ref=f17e101]:
                  - text: Tap
                  - emphasis [ref=f17e102]: Next
                  - text: again in the upper right corner.
              - listitem [ref=f17e103]:
                - paragraph [ref=f17e104]:
                  - text: Tap
                  - emphasis [ref=f17e105]: Create Adjustment and Finish
                  - text: .
            - paragraph [ref=f17e106]: Your account balance in YNAB should now match your current cleared account balance! We recommend reconciling at least once a week since it makes it easier to keep up with (and can prevent Reconciliation Balance Adjustments from being needed at all!).
        - paragraph [ref=f17e107]:
          - link "Back to Top" [ref=f17e108] [cursor=pointer]:
