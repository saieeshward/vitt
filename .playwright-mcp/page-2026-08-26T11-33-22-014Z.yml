      - generic [ref=f17e34]:
        - paragraph [ref=f17e35]: Address discrepancies between your YNAB account balance and real-world balance with a Reconciliation Balance Adjustment. Understand when to make balance adjustments and how they affect your plan numbers. Learn the process of creating and removing a Reconciliation Balance Adjustment, and why it's preferred over a Manual Balance Adjustment.
