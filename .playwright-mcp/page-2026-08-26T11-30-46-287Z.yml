              - generic [ref=e50]:
                - paragraph [ref=e51]: If you have an asset without an online connection (like a boat, jewelry, or cash), you can create a manual account to track it.
                - paragraph [ref=e52]: Manual accounts can also be used for accounts that cannot be connected through our third-party aggregators. For example, mortgages, car loans, and some retirement accounts may not always work well with aggregators, and may have a hard time staying connected or syncing. Rather than continuously needing to updated your login credentials, you can simply update the balance when needed.
                - paragraph [ref=e53]: These manual accounts work especially well when the asset or account doesn’t have many transactions and the balance of the account doesn’t change often.
                - paragraph [ref=e54]: As the name implies, manual accounts track balances and transactions manually, so this information is updated by hand.
                - heading "Table of Contents" [level=3] [ref=e55]
