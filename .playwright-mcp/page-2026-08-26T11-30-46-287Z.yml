                - heading "Adding a Manual Account" [level=3] [ref=e63]
                - paragraph [ref=e64]: "To add a manual account in Monarch:"
                - list [ref=e65]:
                  - listitem [ref=e66]:
                    - text: Navigate to the
                    - strong [ref=e67]: Accounts
                    - text: page
                  - listitem [ref=e68]:
                    - text: Select
                    - strong [ref=e69]: +Add Account
                  - listitem [ref=e70]:
                    - text: Select
                    - strong [ref=e71]: Add manual account
                  - listitem [ref=e72]: Select the account type (e.g. cash, vehicles, loans, etc.)
                  - listitem [ref=e73]: Enter the account name, type, and current balance
                  - listitem [ref=e74]:
                    - text: Select
                    - strong [ref=e75]: Save
                - paragraph [ref=e76]: Your manual account will now appear in your account list and is ready to track balances and transactions.
                - heading "Manual Account Balance Updates" [level=3] [ref=e77]
                - paragraph [ref=e78]:
                  - text: Whenever the balance changes, you can update it by selecting “
                  - link "Edit Account" [ref=e79] [cursor=pointer]:
                    - /url: https://help.monarchmoney.com/hc/en-us/articles/360058636951-Edit-accounts
                  - text: .” If you don’t need to keep track of individual transactions under the account, just changing the balance is a great way to keep manual accounts current.
                - paragraph [ref=e80]:
                  - text: Additionally, you can
                  - link "Upload account balance history" [ref=e81] [cursor=pointer]:
                    - /url: https://help.monarchmoney.com/hc/en-us/articles/14882425704212
                  - text: into manual accounts. The upload CSV flow is the only way to change the balance history of a manual account at this time.
                - heading "Manual Account Transaction Updates" [level=3] [ref=e82]
                - paragraph [ref=e83]: You can add a manual transaction to any account by clicking "Add transaction" from either the account or "Add" from the transaction tab.
                - paragraph [ref=e84]:
                  - text: You can also
                  - link "Upload a CSV" [ref=e85] [cursor=pointer]:
                    - /url: https://help.monarchmoney.com/hc/en-us/articles/4409682789908
                  - text: file of transactions to a manual account which is a great way to quickly add a lot of transactions. When you upload the CSV file, you will be able to choose to automatically update the balance of the account. If you
                  - link "add transactions manually" [ref=e86] [cursor=pointer]:
                    - /url: https://help.monarchmoney.com/hc/en-us/articles/360058441811-Creating-manual-transactions
                  - text: ", you will also be able to update the balance of the manual account."
