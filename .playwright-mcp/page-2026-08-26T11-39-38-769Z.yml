              - paragraph [ref=f1e269]: For those seeking the best of Revolut — get exceptional benefits like unlimited airport lounge access, monthly global data, partner subscriptions, and cancellation cover.
      - generic [ref=f1e274]:
        - paragraph [ref=f1e275]: © 2026 Revolut Bank UAB
        - paragraph [ref=f1e276]:
          - text: If you would like to find out more about which Revolut entity you receive services from, please check our corresponding
          - link "FAQ page" [ref=f1e277] [cursor=pointer]:
            - /url: https://help.revolut.com/en-LT/help/more/legal-topics/which-revolut-companies-provide-me-with-services/?geo-redirect=true
          - text: . If you have any other questions, please reach out to us via the in-app chat in the Revolut app.
        - paragraph [ref=f1e278]: "Revolut Bank UAB is authorised and regulated by the Bank of Lithuania in the Republic of Lithuania and by the European Central Bank and is regulated by the Central Bank of Ireland for consumer protection rules. Registered address: Konstitucijos ave. 21B, Vilnius, 08130, the Republic of Lithuania, number of registration 304580906. Revolut Bank UAB is a private limited liability company. Revolut Bank UAB has established a branch in Ireland, number of registration 909790 with its address at 2 Dublin Landings, North Dock, Dublin 1, Ireland."
        - paragraph [ref=f1e279]: "Revolut Insurance Europe UAB is authorised by the Bank of Lithuania in the Republic of Lithuania and is regulated by the Central Bank of Ireland for consumer protection rules. Registered address: Konstitucijos ave. 21B, Vilnius, 08130, the Republic of Lithuania, number of registration 305910164."
        - paragraph [ref=f1e280]: "Investment services are provided by Revolut Securities Europe UAB, represented in Switzerland by Revolut (Switzerland) AG, which is an investment firm authorised by the Bank of Lithuania. Registered address: Konstitucijos ave. 21B, Vilnius, 08130, the Republic of Lithuania, number of registration 305799582."
        - paragraph [ref=f1e281]: "Cryptocurrency products are provided either by:"
        - paragraph [ref=f1e282]: (i) Revolut Digital Assets Europe Ltd (RDAEL), a private company registered in the Republic of Cyprus (no. HE430310) with registered address Omonoias, 13, Soho Office (Embassy), 3052, Limassol, Cyprus. RDAEL is licensed by the Cyprus Securities and Exchange Commission (License No. 001/2025) as a Crypto Asset Service Provider (CASP) under EU Regulation 2023/1114 on markets in crypto-assets (MiCA); or
        - paragraph [ref=f1e283]: "(ii) Revolut Ltd (No. 08804411), a company that is authorised by the Financial Conduct Authority under the Electronic Money Regulations 2011 (Firm Reference 900562), and is registered with the Financial Conduct Authority to offer cryptocurrency services under the Money Laundering, Terrorist Financing and Transfer of Funds (Information on the Payer) Regulations 2017. Registered address: 30 South Colonnade, London E14 5HX, United Kingdom."
        - paragraph [ref=f1e284]: Depending on whether clients have accepted the RDAEL terms and conditions either during the creation of their cryptocurrency account or the migration of EEA clients from Revolut Ltd to RDAEL.
