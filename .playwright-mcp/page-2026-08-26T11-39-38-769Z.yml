              - heading "€3.99/month" [level=3] [ref=f1e238]
              - paragraph [ref=f1e239]: For the smart spender — access additional benefits like better limits for spending abroad and insurance for your purchases, on our affordable paid plan.
        - listitem [ref=f1e243]:
          - link [ref=f1e244] [cursor=pointer]:
