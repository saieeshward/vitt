        - separator [ref=f16e53]
        - heading "Why Reconciling Your Account in YNAB is Important" [level=2] [ref=f16e54]
        - paragraph [ref=f16e55]: Your plan is based on the amount and transactions in your account in YNAB. We reconcile to make sure they are correct.
        - paragraph [ref=f16e56]:
          - text: Clicking or tapping the
          - emphasis [ref=f16e57]: Reconcile
          - text: button in your account register also tells YNAB not to import previous transactions, even if the bank tries to send them again. Our anti-duplicate logic keeps any transactions from more than three days prior to the last reconciled transaction from importing, so reconciling reduces the possibility of duplicates.
        - paragraph [ref=f16e58]:
          - text: Clicking or tapping the
          - emphasis [ref=f16e59]: Reconcile
          - text: button in YNAB puts green lock icons next to reconciled transactions, so you know how recently your balance and transactions in YNAB agreed with your bank.
        - heading [level=3] [ref=f16e60]:
          - text: How to Find the
          - emphasis [ref=f16e61]: Reconcile
          - text: Button in YNAB
