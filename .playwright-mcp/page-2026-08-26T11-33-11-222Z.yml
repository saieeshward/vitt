        - heading "How to Reconcile" [level=2] [ref=f16e88]
        - paragraph [ref=f16e89]: "To get started with reconciling your accounts, you'll need three things for this process: your account register in YNAB, your current balance at your bank, and a list of your bank transactions."
        - generic [ref=f16e90]:
          - tablist [ref=f16e92]:
            - tab "iOS" [ref=f16e93] [cursor=pointer]
            - tab "Android" [ref=f16e94] [cursor=pointer]
            - tab "Web" [ref=f16e95] [cursor=pointer]
          - tabpanel [ref=f16e97]:
            - list [ref=f16e98]:
              - listitem [ref=f16e99]:
                - paragraph [ref=f16e100]: Open the YNAB app and log in to your online banking on your mobile device.
              - listitem [ref=f16e101]:
                - paragraph [ref=f16e102]: Add recent transactions into YNAB.
                - list [ref=f16e103]:
                  - listitem [ref=f16e104]:
                    - paragraph [ref=f16e105]: Import and approve or manually enter transactions that appear at the bank but aren't in YNAB yet. If they have cleared at the bank, mark them as cleared in YNAB. If they are pending, leave them uncleared.
              - listitem [ref=f16e106]:
                - paragraph [ref=f16e107]:
                  - text: Review your uncleared transactions by tapping the banner displaying “Show [#] uncleared transactions" in your account register. This banner will be dismissed once
                  - strong [ref=f16e108]: all
                  - text: transactions cleared at the bank have been marked as cleared or reconciled in YNAB.
                - img "Tapping the uncleared transactions banner in the mobile app shows two uncleared transactions in the account register" [ref=f16e109]
                - list [ref=f16e110]:
                  - listitem [ref=f16e111]:
                    - paragraph [ref=f16e112]: Uncleared transactions in YNAB should only be very recent transactions that show as pending at the bank, or that your bank doesn't know about yet.
                    - list [ref=f16e113]:
                      - listitem [ref=f16e114]:
                        - paragraph [ref=f16e115]:
                          - text: If uncleared transactions have cleared the bank, or are dated over a month ago and would be difficult to compare them to your banking records, change the status to cleared by tapping on the transaction, tapping
                          - emphasis [ref=f16e116]: Show more
                          - text: ", and toggling the"
                          - emphasis [ref=f16e117]: Cleared
                          - text: status on. Then, tap
                          - emphasis [ref=f16e118]: Save
                          - text: .
                      - listitem [ref=f16e119]:
                        - paragraph [ref=f16e120]: If they are pending at the bank, or your bank doesn't know about them yet, leave them uncleared.
              - listitem [ref=f16e121]:
                - paragraph [ref=f16e122]:
                  - text: When you're done, find your
                  - link "current cleared balance" [ref=f16e123] [cursor=pointer]:
                    - /url: https://support.ynab.com/en_us/finding-your-cleared-balance-to-reconcile-an-overview-BkH27l_A9
                  - text: at the bank.
                - list [ref=f16e124]:
                  - listitem [ref=f16e125]:
                    - paragraph [ref=f16e126]:
                      - text: The number you want won’t include any pending transactions and is most often called the Current Balance. If you need help finding it,
                      - link "tell the chatbot you need a human or send us an email" [ref=f16e127] [cursor=pointer]:
                        - /url: https://support.ynab.com/en_us/how-to-get-help-SygqcvtC5
                      - text: .
              - listitem [ref=f16e128]:
                - paragraph [ref=f16e129]:
                  - text: Tap the
                  - emphasis [ref=f16e130]: Accounts
                  - text: tab at the bottom of the app and choose the account you're reconciling. Then, tap the three dots icon in the top right corner.
              - listitem [ref=f16e131]:
                - paragraph [ref=f16e132]:
                  - text: Tap
                  - emphasis [ref=f16e133]: Reconcile
                  - text: (actually clicking or tapping the
                  - emphasis [ref=f16e134]: Reconcile
                  - text: button and completing the steps is important—it does some work behind the scenes to keep everything running correctly.)
                - list [ref=f16e135]:
                  - listitem [ref=f16e136]:
                    - paragraph [ref=f16e137]:
                      - text: A pop up will ask if your bank's balance
                      - strong [ref=f16e138]: matches
                      - text: the Cleared balance that YNAB is showing you. If it is, tap
                      - emphasis [ref=f16e139]: "Yes"
                      - text: . If YNAB and the bank match, you're reconciled!
                  - listitem [ref=f16e140]:
                    - paragraph [ref=f16e141]:
                      - text: If your cleared balance at the bank
                      - strong [ref=f16e142]: does not match
                      - text: the cleared balance, you'll tap
                      - emphasis [ref=f16e143]: "No"
                      - text: and enter your current cleared balance. Toggle to the minus sign for a negative balance, if applicable. Tap
                      - emphasis [ref=f16e144]: Next
                      - text: and then
                      - emphasis [ref=f16e145]: Create Adjustment and Finish
                      - text: .
            - generic [ref=f16e146]:
              - heading "Linked versus Unlinked Accounts" [level=4] [ref=f16e147]
              - paragraph [ref=f16e148]:
                - text: We use different phrasing when prompting you to reconcile linked accounts (versus unlinked accounts)
                - strong [ref=f16e149]: in the iOS app
                - text: . Here's why. For linked accounts, we're able to import a recent balance from your bank, and this requires a slightly different workflow.
              - paragraph [ref=f16e150]:
                - text: There are three paths you can encounter when reconciling
                - strong [ref=f16e151]: "linked accounts:"
              - list [ref=f16e152]:
                - listitem [ref=f16e153]:
                  - paragraph [ref=f16e154]:
                    - text: If the cleared balance matches the imported balance, you'll click the
                    - emphasis [ref=f16e155]: Looks Good
                    - text: button.
                - listitem [ref=f16e156]:
                  - paragraph [ref=f16e157]: If the bank includes pending transactions in the balance we're importing, we will show the difference with a prompt for the next steps.
                - listitem [ref=f16e158]:
                  - paragraph [ref=f16e159]:
                    - text: If the balance doesn't match the imported balance, clicking the
                    - emphasis [ref=f16e160]: Reconcile
                    - text: button will only display the Cleared YNAB Balance. You'll click
                    - emphasis [ref=f16e161]: "Yes"
                    - text: or
                    - emphasis [ref=f16e162]: "No"
                    - text: to move through the rest of the flow.
              - paragraph [ref=f16e163]: Rest assured, by following the onscreen prompts, you'll be able to successfully reconcile all of your accounts, regardless of whether they're linked or unlinked.
        - paragraph [ref=f16e164]:
          - link "Back to Top" [ref=f16e165] [cursor=pointer]:
            - /url: "#backtotop"
        - separator [ref=f16e166]
        - heading "What to Expect after Reconciling" [level=2] [ref=f16e167]
        - paragraph [ref=f16e168]: Your cleared balance in YNAB will match the cleared balance at the bank (to the penny), and your uncleared transactions will be limited to those you've manually entered in the past few days and will clear the bank in the near future. All of your reconciled transactions will have little lock icons. After a transaction has been reconciled, it will remain reconciled. There is no way to reverse this, and the lock icons will remain in place.Moving forward, YNAB will only import transactions dated up to three days prior to your last reconciled transaction. This is good news, as it helps to prevent duplicates from importing!
        - paragraph [ref=f16e169]:
          - text: If you created a
          - link "Reconciliation Balance Adjustment" [ref=f16e170] [cursor=pointer]:
            - /url: https://support.ynab.com/en_us/balance-adjustments-a-guide-rko4OwILs
          - text: ", that may affect your numbers because the amount of money in your plan is based off the amount of your cash-positive accounts in YNAB."
        - paragraph [ref=f16e171]: Head over to your plan and move money where you need it. If you created a balance adjustment in a credit card account, double-check that the card's Credit Card Payment category in YNAB has the amount you want set aside for your next payment. If you pay your card in full that means you should have the exact amount in your Credit Card Payment category as the working balance of the card. If those differ, move money to or from the category as needed until they match.
        - paragraph [ref=f16e172]:
          - link "Back to Top" [ref=f16e173] [cursor=pointer]:
            - /url: "#backtotop"
        - separator [ref=f16e174]
        - heading "Make a Mistake?" [level=2] [ref=f16e175]
        - paragraph [ref=f16e176]:
          - text: Did you notice a mistake after you reconciled? Once an individual transaction has been reconciled, it will remain reconciled, and this can not be changed. But, you
          - strong [ref=f16e177]: can
          - link "fix other errors and reconcile again" [ref=f16e178] [cursor=pointer]:
            - /url: https://support.ynab.com/en_us/can-i-unreconcile-a-transaction-SJ0NquLye
          - text: "! The important thing is that you reconcile to the accurate amount at your bank, not that you get it perfect the first time."
        - paragraph [ref=f16e179]:
          - link "Back to Top" [ref=f16e180] [cursor=pointer]:
            - /url: "#backtotop"
        - separator [ref=f16e181]
        - heading "What to Expect the Next Time You Reconcile" [level=2] [ref=f16e182]
        - paragraph [ref=f16e183]:
          - text: The next time you reconcile, you'll follow the same steps but you’ll only need to reconcile the transactions that don't yet have the lock symbol.
          - strong [ref=f16e184]: We recommend reconciling your spending accounts at least once a week.
          - text: The more often you reconcile, the quicker and easier it is each time!
        - paragraph [ref=f16e185]:
          - link "Back to Top" [ref=f16e186] [cursor=pointer]:
            - /url: "#backtotop"
