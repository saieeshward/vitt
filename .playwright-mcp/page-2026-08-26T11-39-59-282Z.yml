            - article [ref=f3e101]:
              - heading "What currency will I be charged in?" [level=2] [ref=f3e103]
              - generic [ref=f3e104]:
                - generic [ref=f3e105]:
                  - heading "How Revolut determines the currency you'll be charged in" [level=3] [ref=f3e106]
                  - generic [ref=f3e107]:
                    - paragraph [ref=f3e108]: We automatically convert your balance to the currency you're paying in, so there's no need to buy or exchange currency before your trip. We won't combine multiple currencies to complete a transaction. Read more about our exchange rates in this FAQ.
                    - paragraph [ref=f3e109]: "When you make a payment in-app, we'll check your currency balances in the below order (and complete the transaction in the first currency that has enough funds to complete the transaction):"
                    - list [ref=f3e110]:
                      - listitem [ref=f3e111]: Transaction currency
                      - listitem [ref=f3e112]: Your base currency (EUR)
                      - listitem [ref=f3e113]: The active currency with the highest balance
                - generic [ref=f3e114]:
                  - heading "How to control the currency used for a transaction" [level=3] [ref=f3e115]
                  - generic [ref=f3e116]:
                    - paragraph [ref=f3e117]: "You can assign a specific currency to a card by following these steps in-app:"
                    - list [ref=f3e118]:
                      - listitem [ref=f3e119]: Go to 'Home' on the bottom menu
                      - listitem [ref=f3e120]:
                        - generic [ref=f3e121]: Select the card you want to use
                      - listitem [ref=f3e122]: Tap 'Settings'
                      - listitem [ref=f3e123]: Under 'Spend from', choose a currency
                      - listitem [ref=f3e124]: Select 'All cash accounts' or any currency you want to be charged in. After that, card payments will be charged in the same order as your selected currencies
                - generic [ref=f3e125]:
                  - heading "Declined transactions" [level=3] [ref=f3e126]
                  - generic [ref=f3e127]:
                    - paragraph [ref=f3e128]: "The transaction will be declined in the following scenarios:"
                    - list [ref=f3e129]:
                      - listitem [ref=f3e130]: Insufficient funds in a single currency to cover the transaction amount plus fees
                      - listitem [ref=f3e131]: Insufficient funds in the currency assigned to the card
                      - listitem [ref=f3e132]:
                        - generic [ref=f3e133]: Normal decline reasons, unrelated to the currency. For more info, read this FAQ
