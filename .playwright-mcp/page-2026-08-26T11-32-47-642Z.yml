        - separator [ref=f14e46]
        - heading "What is the Starting Balance?" [level=2] [ref=f14e47]
        - paragraph [ref=f14e48]:
          - text: The Starting Balance is the transaction with the earliest date in your YNAB account register that represents
          - strong [ref=f14e49]: all
          - text: of your previous transaction history in one number. Because it's composed of past transaction history, you
          - strong [ref=f14e50]: don’t
          - text: want to include any
          - link "pending transactions" [ref=f14e51] [cursor=pointer]:
            - /url: https://support.ynab.com/en_us/pending-transactions-an-overview-Bk0WoOcA5
          - text: .
        - paragraph [ref=f14e52]:
          - text: After the Starting Balance is added, your money is ready and waiting in Ready to Assign.
          - strong [ref=f14e53]: "Note:"
          - text: If the amount in Ready to Assign seems off, try our
          - link "YNAB Checkup" [ref=f14e54] [cursor=pointer]:
            - /url: https://support.ynab.com/en_us/checkup-S1vJzWGzo
          - text: process to confirm your numbers are accurate.
        - paragraph [ref=f14e55]:
          - link "Back to Top" [ref=f14e56] [cursor=pointer]:
            - /url: "#backtotop"
        - separator [ref=f14e57]
        - heading "My Starting Balance is Wrong" [level=2] [ref=f14e58]
        - paragraph [ref=f14e59]:
          - text: If you've linked your account for Direct Import, the account will bring in the current balance as your Starting Balance. Sometimes Starting Balances pull in incorrectly, but it's easily fixable by editing the transaction date and amount. It's also
          - strong [ref=f14e60]: not
          - text: an indication that you'll have importing issues going forward. Review our
          - link "troubleshooting steps for an incorrect starting balance" [ref=f14e61] [cursor=pointer]:
            - /url: https://support.ynab.com/en_us/troubleshooting-linked-accounts-BJ9Mv9b1s
          - text: in our general Direct Import guide!
        - paragraph [ref=f14e62]:
          - link "Back to Top" [ref=f14e63] [cursor=pointer]:
            - /url: "#backtotop"
        - separator [ref=f14e64]
        - heading "Can I Import Past Transactions from before My Starting Balance?" [level=2] [ref=f14e65]
        - paragraph [ref=f14e66]:
          - text: Yes, but you’ll need to use
          - link "File-Based Import" [ref=f14e67] [cursor=pointer]:
            - /url: https://support.ynab.com/en_us/file-based-import-a-guide-Bkj4Sszyo
          - text: to do so.
        - paragraph [ref=f14e68]:
          - text: Because YNAB is built around prioritizing the money you have now and looking
          - strong [ref=f14e69]: forward
          - text: ", we highly recommend making a"
          - link "Fresh Start" [ref=f14e70] [cursor=pointer]:
            - /url: https://support.ynab.com/en_us/plan-resets-and-fresh-starts-HkXYR_c0q
          - text: after bringing in past transactions. Why? This allows you to be informed by the past (the historical transactions in an archived plan) while focusing on the future in your current plan—without having to spend all that time categorizing past spending.
        - paragraph [ref=f14e71]:
          - link "Back to Top" [ref=f14e72] [cursor=pointer]:
            - /url: "#backtotop"
        - separator [ref=f14e73]
        - heading "What if I Deleted my Starting Balance?" [level=2] [ref=f14e74]
        - paragraph [ref=f14e75]: If you deleted your Starting Balance transaction, you can follow these steps to create a new one.
