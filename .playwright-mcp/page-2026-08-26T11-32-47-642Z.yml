                  - text: Tap the
                  - emphasis [ref=f14e87]: Accounts
                  - text: tab at the bottom of the app.
              - listitem [ref=f14e88]:
                - paragraph [ref=f14e89]: Tap an account.
              - listitem [ref=f14e90]:
                - paragraph [ref=f14e91]: Tap the three dots icon in the top right corner.
              - listitem [ref=f14e92]:
                - paragraph [ref=f14e93]:
                  - text: Tap
                  - emphasis [ref=f14e94]: Reconcile
                  - text: .
              - listitem [ref=f14e95]:
                - paragraph [ref=f14e96]:
                  - text: Tap
                  - emphasis [ref=f14e97]: "No"
                  - text: .
              - listitem [ref=f14e98]:
                - paragraph [ref=f14e99]: Enter your current balance. Do not include pending transactions.
              - listitem [ref=f14e100]:
                - paragraph [ref=f14e101]:
                  - text: Tap
                  - emphasis [ref=f14e102]: Next
                  - text: .
              - listitem [ref=f14e103]:
                - paragraph [ref=f14e104]:
                  - text: Tap
                  - emphasis [ref=f14e105]: Next
                  - text: a second time.
              - listitem [ref=f14e106]:
