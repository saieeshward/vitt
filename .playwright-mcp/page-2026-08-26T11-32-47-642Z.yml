                  - emphasis [ref=f14e112]: OK
                  - text: .
            - paragraph [ref=f14e113]:
              - text: Once you've finished, YNAB will enter a "Reconciliation Balance Adjustment" transaction. If you can't find it, tap the three dots icon in the top right corner and tap
              - emphasis [ref=f14e114]: Show Reconciled
              - text: ". Then, edit the adjustment transaction:"
            - list [ref=f14e115]:
              - listitem [ref=f14e116]:
                - paragraph [ref=f14e117]: Tap the Reconciliation Balance Adjustment transaction to edit.
              - listitem [ref=f14e118]:
                - paragraph [ref=f14e119]: Change the date of the Reconciliation Balance Adjustment transaction to the day before your first transaction in that account.
              - listitem [ref=f14e120]:
                - paragraph [ref=f14e121]:
                  - text: Rename the Payee to "Starting Balance" and tap
                  - emphasis [ref=f14e122]: Save
